<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 420 760">

<defs>

<linearGradient id="card"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop offset="0%" stop-color="#8B5CF6"/>
<stop offset="100%" stop-color="#EC4899"/>

</linearGradient>

<linearGradient id="ring">

<stop offset="0%" stop-color="#FF5EA8"/>
<stop offset="100%" stop-color="#7C3AED"/>

</linearGradient>

<filter id="shadow">

<feDropShadow
dx="0"
dy="10"
stdDeviation="12"
flood-opacity=".35"/>

</filter>

</defs>

<!-- Strap -->

<rect
x="192"
y="0"
width="36"
height="150"
rx="18"
fill="url(#card)"/>

<!-- Metal Ring -->

<circle
cx="210"
cy="165"
r="24"
fill="#d9d9d9"
stroke="#ffffff"
stroke-width="5"/>

<!-- Swing Animation -->

<g>

<animateTransform
attributeName="transform"
type="rotate"
values="-8 210 0;8 210 0;-8 210 0"
dur="4s"
repeatCount="indefinite"/>

<!-- Badge -->

<rect
x="55"
y="185"
width="310"
height="470"
rx="32"
fill="#141414"
stroke="url(#card)"
stroke-width="3"
filter="url(#shadow)"/>

<!-- Header -->

<rect
x="55"
y="185"
width="310"
height="90"
rx="30"
fill="url(#card)"/>

<text
x="92"
y="240"
font-size="26"
fill="white"
font-family="Verdana">

DEV PASS

</text>

<!-- Avatar Ring -->

<circle
cx="210"
cy="355"
r="82"
fill="#202020"
stroke="url(#ring)"
stroke-width="6">

<animate
attributeName="stroke-dashoffset"
from="500"
to="0"
dur="5s"
repeatCount="indefinite"/>

</circle>

<!-- Replace this later -->

<circle
cx="210"
cy="355"
r="66"
fill="#333"/>

<text
x="175"
y="362"
font-size="18"
fill="#ffffff">

A

</text>

<!-- Name -->

<text
x="82"
y="490"
font-size="28"
fill="#ffffff"
font-family="Verdana">

Anshika Agrawal

</text>

<!-- Role -->

<text
x="82"
y="525"
font-size="18"
fill="#bdbdbd">

AI / Full Stack Developer

</text>

<!-- Barcode -->

<g transform="translate(85 560)">

<rect width="3" height="70" fill="white"/>
<rect x="8" width="1" height="70" fill="white"/>
<rect x="15" width="5" height="70" fill="white"/>
<rect x="27" width="2" height="70" fill="white"/>
<rect x="35" width="6" height="70" fill="white"/>
<rect x="49" width="2" height="70" fill="white"/>
<rect x="57" width="4" height="70" fill="white"/>
<rect x="67" width="2" height="70" fill="white"/>
<rect x="75" width="6" height="70" fill="white"/>
<rect x="90" width="2" height="70" fill="white"/>
<rect x="98" width="5" height="70" fill="white"/>
<rect x="110" width="3" height="70" fill="white"/>
<rect x="118" width="2" height="70" fill="white"/>
<rect x="126" width="6" height="70" fill="white"/>

</g>

<!-- ID -->

<text
x="125"
y="650"
font-size="18"
fill="#888">

ID : AG-2410

</text>

</g>

</svg>
