x="85"
y="225"
width="540"
height="150"
rx="20"
fill="#111"/>

<circle cx="110" cy="245" r="6" fill="#ff605c"/>
<circle cx="130" cy="245" r="6" fill="#ffbd44"/>
<circle cx="150" cy="245" r="6" fill="#00ca4e"/>

<text
x="110"
y="285"
