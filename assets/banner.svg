<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 1280 740">

<defs>

<linearGradient id="bg"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop offset="0%"
stop-color="#120019"/>

<stop offset="50%"
stop-color="#26003d"/>

<stop offset="100%"
stop-color="#48006e"/>

<animate attributeName="x1"
values="0%;100%;0%"
dur="12s"
repeatCount="indefinite"/>

</linearGradient>

<linearGradient id="pink">

<stop offset="0%"
stop-color="#ff3cac"/>

<stop offset="100%"
stop-color="#784ba0"/>

<animate attributeName="stop-color"
values="#ff3cac;#ff77ff;#ff3cac"
dur="4s"
repeatCount="indefinite"/>

</linearGradient>

<filter id="glow">

<feGaussianBlur stdDeviation="8"/>

</filter>

<filter id="glass">

<feGaussianBlur stdDeviation="18"/>

</filter>

</defs>

<rect
width="1280"
height="740"
fill="url(#bg)"/>

<!-- animated stars -->

<g>

<circle cx="60" cy="90" r="2" fill="#fff">

<animate attributeName="opacity"
values="0;1;0"
dur="3s"
repeatCount="indefinite"/>

</circle>

<circle cx="320" cy="150" r="2"/>

<circle cx="850" cy="210" r="3"/>

<circle cx="1100" cy="120" r="2"/>

<circle cx="990" cy="520" r="2"/>

</g>

<!-- scan lines -->

<g opacity=".08">

<rect y="0" width="1280" height="2" fill="#fff">

<animateTransform
attributeName="transform"
type="translate"
from="0 -5"
to="0 740"
dur="6s"
repeatCount="indefinite"/>

</rect>

</g>

<!-- left card -->

<rect
x="55"
y="60"
rx="28"
ry="28"
width="630"
height="620"
fill="#ffffff18"
stroke="#ffffff33"/>

<!-- Name -->

<text
x="90"
y="135"
font-size="56"
font-family="Brush Script MT"
fill="url(#pink)">

Anshika Agrawal

</text>

<!-- Neon -->

<text
x="92"
y="135"
font-size="56"
font-family="Brush Script MT"
fill="#ff66cc"
opacity=".35"
filter="url(#glow)">

Anshika Agrawal

</text>

<!-- typing role -->

<text
x="90"
y="185"
font-size="26"
fill="#ffffff">

<tspan>

Full Stack Developer

<animate
attributeName="opacity"
values="1;0;0"
dur="9s"
repeatCount="indefinite"/>

</tspan>

<tspan>

AI ML Engineer

<animate
attributeName="opacity"
values="0;1;0"
dur="9s"
repeatCount="indefinite"/>

</tspan>

<tspan>

Computer Vision

<animate
attributeName="opacity"
values="0;0;1"
dur="9s"
repeatCount="indefinite"/>

</tspan>

</text>

<!-- terminal -->

