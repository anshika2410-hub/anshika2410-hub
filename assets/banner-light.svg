<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 1280 740">

<defs>

<linearGradient id="bg"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop offset="0%" stop-color="#fff7fd"/>
<stop offset="50%" stop-color="#f5edff"/>
<stop offset="100%" stop-color="#ede4ff"/>

<animate attributeName="x1"
values="0%;100%;0%"
dur="10s"
repeatCount="indefinite"/>

</linearGradient>

<linearGradient id="name">

<stop offset="0%" stop-color="#ff4fa8"/>
<stop offset="100%" stop-color="#6b5cff"/>

</linearGradient>

<filter id="glow">

<feGaussianBlur stdDeviation="5"/>

</filter>

</defs>

<rect
width="1280"
height="740"
fill="url(#bg)"/>

<!-- floating circles -->

<circle
cx="150"
cy="120"
r="120"
fill="#ff4fa810"
>

<animateTransform
attributeName="transform"
type="translate"
values="0 0;30 20;0 0"
dur="7s"
repeatCount="indefinite"/>

</circle>

<circle
cx="1140"
cy="590"
r="160"
fill="#7b5cff12">

<animateTransform
attributeName="transform"
type="translate"
values="0 0;-25 -30;0 0"
dur="9s"
repeatCount="indefinite"/>

</circle>

<!-- Glass Card -->

<rect
x="55"
y="60"
width="1170"
height="620"
rx="30"
fill="#ffffffaa"
stroke="#d8c9ff"
stroke-width="2"/>

<!-- Name -->

<text
x="90"
y="130"
font-size="58"
font-family="Brush Script MT"
fill="url(#name)">

Anshika Agrawal

</text>

<text
x="90"
y="175"
font-size="24"
fill="#444">

Full Stack Developer • AI/ML Engineer

</text>

<!-- Terminal -->

<rect
x="90"
y="220"
width="520"
height="150"
rx="18"
fill="#ffffff"
stroke="#dddddd"/>

<circle cx="110" cy="240" r="6" fill="#ff605c"/>
<circle cx="130" cy="240" r="6" fill="#ffbd44"/>
<circle cx="150" cy="240" r="6" fill="#00ca4e"/>

<text
x="115"
y="285"
font-size="18"
fill="#7b5cff"
font-family="monospace">

$ npm run dev

</text>

<text
x="115"
y="320"
font-size="18"
fill="#333"
font-family="monospace">

Compiled Successfully...

<animate
attributeName="opacity"
values="0;1;0"
dur="2s"
repeatCount="indefinite"/>

</text>

<!-- Code Card -->

<rect
x="90"
y="405"
width="520"
height="210"
rx="18"
fill="#ffffff"
stroke="#dddddd"/>

<text
x="120"
y="455"
font-size="18"
font-family="monospace"
fill="#ff4fa8">

const

</text>

<text
x="180"
y="455"
font-size="18"
font-family="monospace"
fill="#222">

Developer = () => {

</text>

<text
x="140"
y="495"
font-size="18"
font-family="monospace"
fill="#6b5cff">

return (

</text>

<text
x="170"
y="535"
font-size="18"
font-family="monospace"
fill="#ff7d4d">

&lt;Portfolio /&gt;

</text>

<text
x="140"
y="575"
font-size="18"
font-family="monospace"
fill="#6b5cff">

)

</text>

<text
x="120"
y="610"
font-size="18"
font-family="monospace"
fill="#ff4fa8">

}

</text>

<!-- Avatar -->

<circle
cx="980"
cy="360"
r="150"
fill="#f7f2ff"
stroke="#ff4fa8"
stroke-width="4"/>

<text
x="920"
y="365"
font-size="22"
fill="#666">

Avatar

</text>

<!-- Tech Pills -->

<g>

<rect x="860" y="560" rx="20" width="100" height="40" fill="#ff4fa8"/>
<text x="890" y="585" fill="white">React</text>

</g>

<g>

<rect x="980" y="560" rx="20" width="110" height="40" fill="#6b5cff"/>
<text x="1010" y="585" fill="white">Python</text>

</g>

<g>

<rect x="1110" y="560" rx="20" width="110" height="40" fill="#00b4ff"/>
<text x="1135" y="585" fill="white">FastAPI</text>

</g>

<!-- Footer -->

<text
x="760"
y="655"
font-size="30"
fill="#6b5cff">

CREATE • BUILD • INSPIRE

<animate
attributeName="opacity"
values="1;.4;1"
dur="2s"
repeatCount="indefinite"/>

</text>

</svg>
